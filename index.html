<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 献立サジェスター</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f8f9fa; color: #333; }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; }
    .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-top: 12px; margin-bottom: 4px; font-size: 0.9rem; }
    input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
    textarea { resize: vertical; height: 60px; }
    button { width: 100%; background: #007bff; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 16px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .preview-container { display: flex; gap: 8px; margin-top: 8px; }
    .preview-container img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .dish-card { background: #f0f7ff; border: 1px solid #cce5ff; border-radius: 8px; padding: 12px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
    .dish-card:hover { background: #e2efff; }
    .dish-title { font-weight: bold; color: #0056b3; margin-bottom: 4px; }
    .loading { text-align: center; font-weight: bold; color: #666; margin: 16px 0; }
    .steps { white-space: pre-wrap; line-height: 1.6; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>🍳 AI 献立サジェスター</h1>

  <div class="card" id="inputCard">
    <label>Gemini APIキー</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">

    <label>食材の写真（最大3枚）</label>
    <input type="file" id="imageInput" accept="image/*" multiple>
    <div class="preview-container" id="previewContainer"></div>

    <label>手動入力の食材・調味料</label>
    <textarea id="manualIngredients" placeholder="例: 卵2個、長ねぎ、しょうゆ、ごま油"></textarea>

    <label>時間帯</label>
    <select id="timeOfDay">
      <option value="朝食">朝食</option>
      <option value="昼食">昼食</option>
      <option value="夕食" selected>夕食</option>
      <option value="夜食">夜食</option>
    </select>

    <label>好み・制限時間など</label>
    <input type="text" id="preference" placeholder="例: 15分以内で時短、ヘルシー、辛いものNG">

    <button id="suggestBtn" onclick="generateMenu()">献立を考えてもらう</button>
  </div>

  <div id="loading" class="loading" style="display: none;">AIが考え中...お待ちください</div>

  <div class="card" id="resultCard" style="display: none;">
    <h3>提案されたメニュー（選ぶと手順を表示）</h3>
    <div id="dishList"></div>
  </div>

  <div class="card" id="recipeCard" style="display: none;">
    <h3 id="recipeTitle"></h3>
    <div class="steps" id="recipeSteps"></div>
    <button onclick="resetFlow()" style="background: #6c757d;">別の献立を選ぶ / やり直す</button>
  </div>

  <script>
    let base64Images = [];

    // 画像選択時のプレビュー処理 (最大3枚)
    document.getElementById('imageInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).slice(0, 3);
      const container = document.getElementById('previewContainer');
      container.innerHTML = '';
      base64Images = [];

      for (const file of files) {
        const base64 = await fileToBase64(file);
        base64Images.push(base64);

        const img = document.createElement('img');
        img.src = `data:${file.type};base64,${base64}`;
        container.appendChild(img);
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // 献立を3つ提案
    async function generateMenu() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) return alert('Gemini APIキーを入力してください。');

      const timeOfDay = document.getElementById('timeOfDay').value;
      const ingredients = document.getElementById('manualIngredients').value;
      const pref = document.getElementById('preference').value;

      setLoading(true);

      const prompt = `
添付画像と以下の食材から、【${timeOfDay}】にぴったりの献立を3つ提案してください。
追加食材・調味料: ${ingredients}
好み・条件: ${pref}

必ず以下のJSON形式のみで回答してください:
{
  "menus": [
    {"name": "料理名", "reason": "おすすめ理由や所要時間"}
  ]
}`;

      // Gemini API用パーツの作成
      const parts = [{ text: prompt }];
      base64Images.forEach(base64 => {
        parts.push({
          inline_data: { mime_type: "image/jpeg", data: base64 }
        });
      });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: parts }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const data = await response.json();
        const contentText = data.candidates[0].content.parts[0].text;
        const result = JSON.parse(contentText);

        renderDishList(result.menus);
      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    // 提案カードの描画
    function renderDishList(menus) {
      const listDiv = document.getElementById('dishList');
      listDiv.innerHTML = '';

      menus.forEach(menu => {
        const item = document.createElement('div');
        item.className = 'dish-card';
        item.innerHTML = `<div class="dish-title">${menu.name}</div><div>${menu.reason}</div>`;
        item.onclick = () => getRecipeDetail(menu.name);
        listDiv.appendChild(item);
      });

      document.getElementById('resultCard').style.display = 'block';
    }

    // 手順の取得
    async function getRecipeDetail(dishName) {
      const apiKey = document.getElementById('apiKey').value.trim();
      setLoading(true);

      const prompt = `料理「${dishName}」の詳しい調理手順を教えてください。下ごしらえから仕上げまで、順を追って初心者にも分かりやすく箇条書きで記載してください。`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const text = data.candidates[0].content.parts[0].text;

        document.getElementById('recipeTitle').innerText = dishName;
        document.getElementById('recipeSteps').innerText = text;
        document.getElementById('recipeCard').style.display = 'block';
        document.getElementById('recipeCard').scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert('手順の取得に失敗しました: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(isLoading) {
      document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
      document.getElementById('suggestBtn').disabled = isLoading;
    }

    function resetFlow() {
      document.getElementById('recipeCard').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
