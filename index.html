<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Transfer - オフライン高速データ転送</title>
    <!-- QRコード生成ライブラリ (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- QRコードカメラ読み取りライブラリ (CDN) -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151d30;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin: 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(11, 15, 25, 0.5);
        }

        .drop-zone:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .drop-zone p {
            margin: 0;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .drop-zone .file-name {
            color: var(--accent);
            font-weight: 600;
        }

        .controls {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .controls label {
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 14px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* 視覚的ビジュアルエリア */
        .qr-display {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 16px;
            min-height: 240px;
        }

        #qrcode canvas, #qrcode img {
            display: block;
            margin: 0 auto;
        }

        /* プログレスバーデザイン */
        .progress-wrapper {
            margin-top: 16px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            border-radius: 5px;
            transition: width 0.1s linear;
        }

        /* カメラリーダー表示枠 */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #000;
        }

        .download-box {
            margin-top: 16px;
            padding: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .download-box a {
            color: var(--success);
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ QR STREAM TRANSFER</h1>
        <p>高速パラパラQRコード表示による完全オフライン転送システム</p>
    </header>

    <!-- 1. 送信側 (QR作成) -->
    <div class="card">
        <div class="card-title">📤 1. データ送信 (連続QRコード表示)</div>
        
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <p id="fileNameDisplay">📂 クリックしてファイルを選択</p>
            <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)">
        </div>

        <div class="controls">
            <label>
                <span>切り替え速度 (FPS):</span>
                <span id="fpsVal">10 FPS</span>
            </label>
            <input type="range" id="fpsRange" min="1" max="25" value="10" oninput="document.getElementById('fpsVal').innerText = this.value + ' FPS'">
        </div>

        <button class="btn" id="startTxBtn" onclick="startQRStream()">送信開始 (パラパラ漫画再生)[cite: 1]</button>
        <button class="btn btn-danger" id="stopTxBtn" onclick="stopQRStream()" style="display:none;">停止</button>

        <div class="progress-wrapper">
            <div class="progress-info">
                <span id="txStatus">待機中</span>
                <span id="txPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="txProgressFill"></div>
            </div>
        </div>

        <div class="qr-display">
            <div id="qrcode"></div>
        </div>
    </div>

    <!-- 2. 受信側 (カメラ読み取り) -->
    <div class="card">
        <div class="card-title">📥 2. データ受信 (カメラ読み取り)[cite: 1]</div>

        <button class="btn" id="startRxBtn" onclick="startCamera()">カメラでスキャンを開始[cite: 1]</button>
        <button class="btn btn-danger" id="stopRxBtn" onclick="stopCamera()" style="display:none;">スキャン停止</button>

        <div style="margin-top: 16px;">
            <div id="reader"></div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-info">
                <span id="rxStatus">スキャン停止中</span>
                <span id="rxPercent">0 / 0 フレーム (0%)</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="rxProgressFill"></div>
            </div>
        </div>

        <div class="download-box" id="downloadBox">
            🎉 データ転送成功！<br>
            <a id="downloadLink" href="#" download="">ファイルをダウンロード</a>
        </div>
    </div>
</div>

<script>
    // --- グローバル変数 ---
    let selectedFile = null;
    let selectedBuffer = null;
    let qrChunks = [];
    let animationTimer = null;
    let currentFrame = 0;
    const CHUNK_SIZE = 120; // QRコード1枚あたりのバイトサイズ (読み取り精度重視)

    let html5QrcodeScanner = null;
    let receivedChunks = {};
    let totalExpectedChunks = 0;

    // --- 1. 送信側処理 ---
    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (file) {
            selectedFile = file;
            document.getElementById('fileNameDisplay').innerHTML = `<span class="file-name">📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>`;
            const reader = new FileReader();
            reader.onload = (evt) => {
                selectedBuffer = new Uint8Array(evt.target.result);
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function startQRStream() {
        if (!selectedBuffer) {
            alert('送信するファイルを選択してください。');
            return;
        }

        const fps = parseInt(document.getElementById('fpsRange').value);
        const totalChunks = Math.ceil(selectedBuffer.length / CHUNK_SIZE);
        qrChunks = [];

        // パケット構成: [index]|[total]|[filename]|[dataBase64][cite: 1]
        for (let i = 0; i < totalChunks; i++) {
            const start = i * CHUNK_SIZE;
            const end = Math.min(start + CHUNK_SIZE, selectedBuffer.length);
            const chunkData = selectedBuffer.slice(start, end);

            let binary = '';
            for (let b = 0; b < chunkData.length; b++) {
                binary += String.fromCharCode(chunkData[b]);
            }
            const base64Data = btoa(binary);

            const packet = `${i}|${totalChunks}|${encodeURIComponent(selectedFile.name)}|${base64Data}`;
            qrChunks.push(packet);
        }

        document.getElementById('startTxBtn').style.display = 'none';
        document.getElementById('stopTxBtn').style.display = 'block';

        const qrcodeContainer = document.getElementById('qrcode');
        qrcodeContainer.innerHTML = '';
        const qr = new QRCode(qrcodeContainer, {
            width: 200,
            height: 200,
            correctLevel: QRCode.CorrectLevel.L
        });

        currentFrame = 0;
        const intervalMs = 1000 / fps;

        animationTimer = setInterval(() => {
            qr.clear();
            qr.makeCode(qrChunks[currentFrame]);

            const pct = Math.floor(((currentFrame + 1) / totalChunks) * 100);
            document.getElementById('txProgressFill').style.width = pct + '%';
            document.getElementById('txPercent').innerText = pct + '%';
            document.getElementById('txStatus').innerText = `再生中: ${currentFrame + 1} / ${totalChunks} コマ`;

            currentFrame = (currentFrame + 1) % totalChunks;
        }, intervalMs);
    }

    function stopQRStream() {
        if (animationTimer) clearInterval(animationTimer);
        document.getElementById('startTxBtn').style.display = 'block';
        document.getElementById('stopTxBtn').style.display = 'none';
        document.getElementById('txStatus').innerText = '停止';
    }

    // --- 2. 受信側処理 (カメラ読み取り＆結合) ---
    function startCamera() {
        receivedChunks = {};
        totalExpectedChunks = 0;
        document.getElementById('downloadBox').style.display = 'none';

        html5QrcodeScanner = new Html5Qrcode("reader");

        const config = { fps: 30, qrbox: { width: 250, height: 250 } };

        html5QrcodeScanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess
        ).then(() => {
            document.getElementById('startRxBtn').style.display = 'none';
            document.getElementById('stopRxBtn').style.display = 'block';
            document.getElementById('rxStatus').innerText = 'スキャン中... QRコードにかざしてください';
        }).catch(err => {
            alert("カメラの起動に失敗しました: " + err);
        });
    }

    function onScanSuccess(decodedText) {
        const parts = decodedText.split('|');
        if (parts.length !== 4) return; // 定義外フォーマットは無視

        const index = parseInt(parts[0]);
        const total = parseInt(parts[1]);
        const fileName = decodeURIComponent(parts[2]);
        const base64Data = parts[3];

        totalExpectedChunks = total;

        // 重複なしで読み取りフレームを保存
        if (!receivedChunks[index]) {
            receivedChunks[index] = { fileName, base64Data };

            const currentCount = Object.keys(receivedChunks).length;
            const pct = Math.floor((currentCount / totalExpectedChunks) * 100);

            document.getElementById('rxProgressFill').style.width = pct + '%';
            document.getElementById('rxPercent').innerText = `${currentCount} / ${totalExpectedChunks} コマ (${pct}%)`;
            document.getElementById('rxStatus').innerText = `受信中: ${currentCount} コマ取得済み`;

            // 全フレームの収集完了判定[cite: 1]
            if (currentCount === totalExpectedChunks) {
                completeReception();
            }
        }
    }

    function completeReception() {
        stopCamera();
        document.getElementById('rxStatus').innerText = '🎉 全フレーム読み取り完了！データを合成中...';

        // 全パケットを順序通りに結合[cite: 1]
        let totalBytes = 0;
        let byteArrays = [];
        let fileName = receivedChunks[0].fileName;

        for (let i = 0; i < totalExpectedChunks; i++) {
            const b64 = receivedChunks[i].base64Data;
            const binStr = atob(b64);
            const len = binStr.length;
            const bytes = new Uint8Array(len);
            for (let j = 0; j < len; j++) {
                bytes[j] = binStr.charCodeAt(j);
            }
            byteArrays.push(bytes);
            totalBytes += len;
        }

        // 単一のBlobに統合
        const mergedArray = new Uint8Array(totalBytes);
        let offset = 0;
        for (let arr of byteArrays) {
            mergedArray.set(arr, offset);
            offset += arr.length;
        }

        const blob = new Blob([mergedArray]);
        const url = URL.createObjectURL(blob);

        const dlLink = document.getElementById('downloadLink');
        dlLink.href = url;
        dlLink.download = fileName;
        dlLink.innerText = `📄 『${fileName}』をダウンロード`;

        document.getElementById('downloadBox').style.display = 'block';
    }

    function stopCamera() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                html5QrcodeScanner.clear();
                document.getElementById('startRxBtn').style.display = 'block';
                document.getElementById('stopRxBtn').style.display = 'none';
            }).catch(err => console.error(err));
        }
    }
</script>

</body>
</html>
