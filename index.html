<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>位置情報・近接時刻同期認証</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      width: 85%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 1.2rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 0.5rem;
      width: 100%;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:active { background: #1d4ed8; }
    #status { margin-top: 1.5rem; font-size: 0.9rem; color: #94a3b8; }
    .success { color: #4ade80 !important; font-size: 1.2rem; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📍 同時タップ認証</h2>
    <p>せーので同時にボタンを押してください</p>

    <button id="syncBtn" onclick="triggerSync()">せーのでタップ！</button>

    <div id="status">待機中...</div>
  </div>

  <script>
    // ハバーサイン公式：2つの緯度経度から距離(m)を算出
    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000; // 地球の半径 (m)
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    function triggerSync() {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "位置情報を取得中...";

      if (!navigator.geolocation) {
        statusEl.innerText = "お使いのブラウザは位置情報に対応していません";
        return;
      }

      // 高精度で位置情報を取得
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const payload = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            timestamp: Date.now() // タップした瞬間のミリ秒
          };

          statusEl.innerText = `データ生成完了!\n時刻: ${payload.timestamp}\n(サーバーへ送信中...)`;

          // ※ 本来はここで Firebase や GAS 等の backend に payload を送信します
          // 以下は2台のデータが揃ったと仮定した照合ロジックのサンプルです
          simulateServerVerification(payload);
        },
        (error) => {
          statusEl.innerText = "位置情報の取得に失敗しました: " + error.message;
        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );
    }

    // サーバー側で行う照合判定のシミュレーション関数
    function simulateServerVerification(deviceA) {
      // 例: もう1台(Device B)の疑似データ（距離約3m、差分300ミリ秒）
      const deviceB = {
        latitude: deviceA.latitude + 0.00003,
        longitude: deviceA.longitude + 0.00003,
        timestamp: deviceA.timestamp + 300 
      };

      const distance = getDistanceInMeters(
        deviceA.latitude, deviceA.longitude,
        deviceB.latitude, deviceB.longitude
      );
      const timeDiff = Math.abs(deviceA.timestamp - deviceB.timestamp);

      const statusEl = document.getElementById('status');

      // 条件: 距離 20m 以内 & 時間差 1000ms(1秒) 以内
      if (distance <= 20 && timeDiff <= 1000) {
        statusEl.className = "success";
        statusEl.innerText = `🔓 認証成功！\n距離: ${distance.toFixed(1)}m / 時間差: ${timeDiff}ms`;
      } else {
        statusEl.innerText = `❌ 認証失敗\n距離: ${distance.toFixed(1)}m / 時間差: ${timeDiff}ms`;
      }
    }
  </script>
</body>
</html>
