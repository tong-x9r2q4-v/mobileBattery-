<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 検索エンジンに登録（インデックス）させないための記述 -->
    <meta name="robots" content="noindex, nofollow">
    <title>Tong リアルP2P ＆ 実機認証システム</title>

    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- tracking.js (Webブラウザ用 軽量リアルタイム顔検出ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>

    <style>
        :root {
            --bg-color: #060913;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --accent-color: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
            --accent-purple: #4facfe;
            --accent-hover: #00c6ff;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.2);
            --border-highlight: rgba(0, 242, 254, 0.6);
            --danger-color: #ff4b72;
            --success-color: #00f5a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(79, 172, 254, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 242, 254, 0.1);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: 0.5px;
        }

        .panel-title span.title-text {
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background-color: rgba(51, 65, 85, 0.5);
            color: var(--text-sub);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }
        .status-tag.online {
            background-color: rgba(0, 245, 160, 0.15);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            box-shadow: 0 0 10px rgba(0, 245, 160, 0.3);
        }

        /* 画面切り替え要素 */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ボタン共通 */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-color) 100%);
            color: #060913;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px var(--accent-glow);
            letter-spacing: 0.5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }
        .btn:active { transform: translateY(0); }
        .btn:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            margin-top: 10px;
            box-shadow: none;
        }
        .btn-secondary:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .home-menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        /* 入力ボックス */
        .input-box {
            width: 100%;
            padding: 14px;
            background-color: rgba(6, 9, 19, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--accent-color);
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            margin: 16px 0;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-box:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .my-id-card {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.08) 0%, rgba(79, 172, 254, 0.03) 100%);
            border: 1px solid var(--border-highlight);
            padding: 20px;
            border-radius: 16px;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }

        /* テンキー計算機 */
        .display-val {
            background-color: rgba(6, 9, 19, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            font-size: 2rem;
            font-weight: 700;
            text-align: right;
            margin-bottom: 18px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .key-btn {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .key-btn:hover {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.15);
        }
        .key-btn:active { transform: scale(0.96); }

        /* NFC タッチ画面 */
        .touch-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px 20px;
            border: 2px dashed var(--accent-color);
            border-radius: 16px;
            margin: 20px 0;
            background: rgba(0, 242, 254, 0.03);
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.05);
        }
        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            animation: floatPulse 2s ease-in-out infinite;
        }
        @keyframes floatPulse {
            0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0px var(--accent-color)); }
            50% { transform: translateY(-6px) scale(1.05); filter: drop-shadow(0 0 12px var(--accent-color)); }
            100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0px var(--accent-color)); }
        }

        /* カメラ ＆ 顔認識ビュー */
        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-highlight);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
            margin: 16px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        canvas.face-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }
        .face-overlay-guide {
            position: absolute;
            width: 140px;
            height: 180px;
            border: 2px dashed var(--accent-color);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(6, 9, 19, 0.55);
        }

        /* 完了画面 */
        .success-box {
            text-align: center;
            padding: 30px 10px;
        }
        .checkmark {
            font-size: 4.5rem;
            color: var(--success-color);
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(0, 245, 160, 0.6);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* トースト通知 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-highlight);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-glow);
            display: none;
            z-index: 100;
            max-width: 80%;
            font-size: 0.9rem;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div id="notification" class="notification">通知メッセージ</div>

<div class="container">
    <div class="panel">
        <div class="panel-title">
            <span class="title-text">Tong 実機P2Pシステム</span>
            <span id="p2pStatusTag" class="status-tag">オフライン</span>
        </div>

        <!-- 1. 初期メニュー画面 -->
        <div id="screenHome" class="screen active">
            <p style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 16px;">処理モードを選択してください。</p>
            <div class="home-menu">
                <button class="btn" onclick="startFlow('payment')">💳 決済機能を開始</button>
                <button class="btn btn-secondary" onclick="startFlow('register')">👤 顔登録を開始</button>
            </div>
        </div>

        <!-- 2. PeerJS 短縮番号 P2P 接続画面 -->
        <div id="screenPairing" class="screen">
            <div class="my-id-card">
                <div style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px;">あなたのペアリング番号 (4桁)</div>
                <strong id="myPeerIdDisplay" style="font-size: 2.2rem; letter-spacing: 6px; color: var(--accent-color); text-shadow: 0 0 12px var(--accent-glow);">----</strong>
            </div>

            <p style="font-size: 0.85rem; color: var(--text-sub); text-align: center;">相手（Android端末）の4桁ペアリング番号を入力してください</p>
            <input type="number" id="remotePeerIdInput" class="input-box" placeholder="8823" maxlength="6" pattern="\d*">
            <button class="btn" onclick="connectToRemotePeer()">P2Pペアリング接続</button>
            <button class="btn btn-secondary" onclick="resetToHome()">キャンセル</button>
        </div>

        <!-- 3. 価格入力テンキー画面（決済フローのみ通過） -->
        <div id="screenKeypad" class="screen">
            <div class="display-val" id="priceDisplay">¥0</div>
            <div class="keypad">
                <button class="key-btn" onclick="appendKey('1')">1</button>
                <button class="key-btn" onclick="appendKey('2')">2</button>
                <button class="key-btn" onclick="appendKey('3')">3</button>
                <button class="key-btn" onclick="appendKey('4')">4</button>
                <button class="key-btn" onclick="appendKey('5')">5</button>
                <button class="key-btn" onclick="appendKey('6')">6</button>
                <button class="key-btn" onclick="appendKey('7')">7</button>
                <button class="key-btn" onclick="appendKey('8')">8</button>
                <button class="key-btn" onclick="appendKey('9')">9</button>
                <button class="key-btn" onclick="clearKey()">C</button>
                <button class="key-btn" onclick="appendKey('0')">0</button>
                <button class="key-btn" onclick="appendKey('00')">00</button>
            </div>
            <button class="btn" style="margin-top: 16px;" onclick="submitPrice()">決済（カード読み取り指示）</button>
        </div>

        <!-- 4. NFC カード読み取り待ち画面 -->
        <div id="screenNfcTouch" class="screen">
            <div class="touch-zone">
                <div class="card-icon">💳</div>
                <div style="font-weight: bold; font-size: 1.15rem; color: var(--accent-color); margin-bottom: 8px;" id="nfcTitleText">カードを読み取ってください</div>
                <div style="font-size: 0.85rem; color: var(--text-main);" id="nfcStatusText">相手端末でNFCカードをかざすのを待っています...</div>
            </div>
            <button class="btn btn-secondary" onclick="cancelNfcScan(); resetToHome();">中断</button>
        </div>

        <!-- 5. 顔認証/顔登録用 カメラ＆検知画面（自端末で処理） -->
        <div id="screenFaceCamera" class="screen">
            <div style="text-align: center; font-weight: bold; color: var(--accent-color); margin-bottom: 8px;" id="cameraGuideText">顔をカメラ枠内に合わせてください</div>
            <div class="camera-wrapper">
                <video id="videoFeed" autoplay playsinline muted></video>
                <canvas id="faceCanvas" class="face-canvas"></canvas>
                <div class="face-overlay-guide"></div>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-sub); text-align: center; margin-bottom: 10px;" id="faceDetectStatus">顔を検出しています...</div>
            <button class="btn" id="actionCamBtn" onclick="onCameraActionClick()" disabled>顔認証を実行</button>
            <button class="btn btn-secondary" onclick="stopCamera(); resetToHome();">キャンセル</button>
        </div>

        <!-- 6. 完了画面 -->
        <div id="screenSuccess" class="screen">
            <div class="success-box">
                <div class="checkmark">✔</div>
                <h3 style="margin-bottom: 8px; font-size: 1.3rem;">処理完了</h3>
                <p style="font-size: 0.85rem; color: var(--text-sub);" id="successDetail">処理が正しく完了しました。</p>
            </div>
            <button class="btn" onclick="resetToHome()">ホームに戻る</button>
        </div>
    </div>
</div>

<script>
    // プレフィックスを付けることで他ユーザーの衝突を回避し短い4桁番号を実現
    const ID_PREFIX = "tong-p2p-";

    let peer = null;
    let conn = null;
    let myShortId = "";
    let currentInputPrice = "0";
    let scannedCardId = null;
    let currentFlowMode = "payment"; // "payment" または "register"

    // NFC関連
    let nfcNDEFReader = null;
    let nfcAbortController = null;

    // カメラ ＆ 顔検知関連
    let currentStream = null;
    let trackingTask = null;
    let isFaceDetected = false;
    let registeredFaceFeatures = null;

    document.addEventListener("DOMContentLoaded", () => {
        initPeerJS();
        loadRegisteredFaceData();
    });

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        const target = document.getElementById(screenId);
        if (target) target.classList.add('active');
    }

    function notify(msg) {
        const el = document.getElementById("notification");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, 3500);
    }

    // --- フロー開始分岐 ---
    function startFlow(mode) {
        currentFlowMode = mode;
        showScreen("screenPairing");
    }

    // --- 1. PeerJS 短縮ID (4桁) P2P 通信処理 ---
    function initPeerJS() {
        myShortId = Math.floor(1000 + Math.random() * 9000).toString();
        const fullPeerId = ID_PREFIX + myShortId;

        peer = new Peer(fullPeerId);

        peer.on('open', (id) => {
            console.log("My Peer Full ID:", id);
            document.getElementById("myPeerIdDisplay").textContent = myShortId;
            updateP2PStatus(false);
        });

        peer.on('error', (err) => {
            console.error("PeerJS Error:", err);
            if (err.type === 'unavailable-id') {
                initPeerJS();
            } else {
                notify("P2P通信エラー: " + err.type);
            }
        });

        peer.on('connection', (c) => {
            conn = c;
            setupP2PConnectionHandlers();
            notify("P2P接続要求を受信し、連携完了しました");
        });
    }

    function connectToRemotePeer() {
        const inputCode = document.getElementById("remotePeerIdInput").value.trim();
        if (!inputCode) {
            notify("相手の4桁ペアリング番号を入力してください");
            return;
        }

        const targetFullId = ID_PREFIX + inputCode;
        notify("番号 " + inputCode + " へ接続中...");
        conn = peer.connect(targetFullId);
        setupP2PConnectionHandlers();
    }

    function setupP2PConnectionHandlers() {
        conn.on('open', () => {
            updateP2PStatus(true);
            notify("P2P端末接続が成功しました！");

            if (document.getElementById("screenPairing").classList.contains("active")) {
                if (currentFlowMode === "payment") {
                    showScreen("screenKeypad");
                } else if (currentFlowMode === "register") {
                    // 顔登録時：相手にNFCスキャン要求を送信して待ち受け
                    sendP2PData({ type: "START_REGISTER_NFC" });
                    document.getElementById("nfcTitleText").textContent = "カード読み取り待機中";
                    document.getElementById("nfcStatusText").textContent = "相手の端末で登録用NFCカードをかざしてください";
                    showScreen("screenNfcTouch");
                }
            }
        });

        conn.on('data', (data) => {
            console.log("P2P Data Received:", data);
            handleIncomingP2PData(data);
        });

        conn.on('close', () => {
            updateP2PStatus(false);
            notify("P2P接続が切断されました");
        });
    }

    function updateP2PStatus(isConnected) {
        const tag = document.getElementById("p2pStatusTag");
        if (isConnected) {
            tag.textContent = "P2P接続完了";
            tag.classList.add("online");
        } else {
            tag.textContent = "未接続";
            tag.classList.remove("online");
        }
    }

    function handleIncomingP2PData(data) {
        if (data.type === "START_REGISTER_NFC") {
            // 相手側からの顔登録用NFC読み取りリクエスト
            notify("登録用NFCカードをこの端末にかざしてください");
            startNfcScan((cardId) => {
                sendP2PData({ type: "CARD_SCANNED", cardId: cardId });
                notify("カード情報を相手端末へ送信しました");
            });
        } else if (data.type === "PAYMENT_REQUEST") {
            // 相手側からの決済NFC読み取りリクエスト
            notify(`決済リクエスト受信: ¥${data.amount}`);
            currentInputPrice = data.amount;
            startNfcScan((cardId) => {
                sendP2PData({ type: "CARD_SCANNED", cardId: cardId });
                notify("カード情報を相手端末へ送信しました");
            });
        } else if (data.type === "CARD_SCANNED") {
            // かざされたNFCカードIDをP2P経由で受信
            scannedCardId = data.cardId;
            notify(`カード認識成功 (ID: ${scannedCardId})`);
            
            if (currentFlowMode === "register") {
                // 顔登録モード：自端末のカメラで顔登録を開始
                startCameraAndFaceDetection("register");
            } else {
                // 決済モード：自端末のカメラで顔認証を開始
                startCameraAndFaceDetection("auth");
            }
        } else if (data.type === "PAYMENT_COMPLETE") {
            document.getElementById("successDetail").textContent = `金額 ¥${Number(data.amount).toLocaleString()} の顔認証P2P決済が完了しました。`;
            showScreen("screenSuccess");
        } else if (data.type === "REGISTER_COMPLETE") {
            document.getElementById("successDetail").textContent = `カード (${data.cardId}) の顔登録が正常に完了しました。`;
            showScreen("screenSuccess");
        }
    }

    function sendP2PData(data) {
        if (conn && conn.open) {
            conn.send(data);
        } else {
            console.warn("P2P未接続のためローカル環境で直接処理します");
            if (data.type === "START_REGISTER_NFC" || data.type === "PAYMENT_REQUEST") {
                startNfcScan((cardId) => {
                    scannedCardId = cardId;
                    startCameraAndFaceDetection(currentFlowMode === "register" ? "register" : "auth");
                });
            }
        }
    }

    // --- 2. Web NFC API 実機カード読み取り機能 ---
    async function startNfcScan(onSuccessCallback) {
        if (!('NDEFReader' in window)) {
            notify("Web NFC非対応環境です。画面タップでシミュレートします。");
            document.getElementById("nfcStatusText").textContent = "【非対応環境】ここをタップしてカード認識";
            document.getElementById("screenNfcTouch").onclick = () => {
                document.getElementById("screenNfcTouch").onclick = null;
                onSuccessCallback("NFC-CARD-SIMULATED-9901");
            };
            return;
        }

        try {
            nfcAbortController = new AbortController();
            nfcNDEFReader = new NDEFReader();

            await nfcNDEFReader.scan({ signal: nfcAbortController.signal });
            notify("NFC読み取り待機中...");

            nfcNDEFReader.addEventListener("readingerror", () => {
                notify("NFCの読み取りに失敗しました。もう一度かざしてください。");
            });

            nfcNDEFReader.addEventListener("reading", ({ serialNumber }) => {
                console.log("NFC Serial Number:", serialNumber);
                notify(`NFC読み取り成功 (ID: ${serialNumber})`);
                cancelNfcScan();
                onSuccessCallback(serialNumber || "NFC-CARD-DEFAULT-ID");
            });

        } catch (error) {
            console.error("NFC Error:", error);
            notify("NFC起動エラー: " + error.message);
        }
    }

    function cancelNfcScan() {
        if (nfcAbortController) {
            nfcAbortController.abort();
            nfcAbortController = null;
        }
    }

    // --- 3. tracking.js によるリアルタイム顔検出 ＆ 画像解析認証 ---
    async function startCameraAndFaceDetection(mode) {
        showScreen("screenFaceCamera");

        const video = document.getElementById("videoFeed");
        const canvas = document.getElementById("faceCanvas");
        const context = canvas.getContext("2d");
        const actionBtn = document.getElementById("actionCamBtn");
        const guideText = document.getElementById("cameraGuideText");
        const detectStatus = document.getElementById("faceDetectStatus");

        actionBtn.disabled = true;
        isFaceDetected = false;

        if (mode === "auth") {
            guideText.textContent = "【顔認証】カメラ枠内に顔を合わせてください";
            actionBtn.textContent = "顔認証を行って決済";
        } else {
            guideText.textContent = "【顔登録】正面を向いて撮影してください";
            actionBtn.textContent = "この顔情報を登録";
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
                audio: false
            });
            currentStream = stream;
            video.srcObject = stream;

            const tracker = new tracking.ObjectTracker('face');
            tracker.setInitialScale(4);
            tracker.setStepSize(2);
            tracker.setEdgesDensity(0.1);

            trackingTask = tracking.track('#videoFeed', tracker);

            tracker.on('track', (event) => {
                context.clearRect(0, 0, canvas.width, canvas.height);

                if (event.data.length === 0) {
                    isFaceDetected = false;
                    detectStatus.textContent = "顔を探しています...";
                    detectStatus.style.color = "var(--text-sub)";
                    actionBtn.disabled = true;
                } else {
                    isFaceDetected = true;
                    detectStatus.textContent = "✔ 顔を検出しました！";
                    detectStatus.style.color = "var(--success-color)";
                    actionBtn.disabled = false;

                    event.data.forEach((rect) => {
                        context.strokeStyle = '#00f2fe';
                        context.lineWidth = 3;
                        context.strokeRect(rect.x, rect.y, rect.width, rect.height);
                    });
                }
            });

        } catch (err) {
            console.error("Camera Error:", err);
            notify("カメラのアクセスに失敗しました");
        }
    }

    function stopCamera() {
        if (trackingTask) {
            trackingTask.stop();
            trackingTask = null;
        }
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
    }

    function onCameraActionClick() {
        if (!isFaceDetected) {
            notify("顔が検出されていません");
            return;
        }

        const video = document.getElementById("videoFeed");
        const captureCanvas = document.createElement("canvas");
        captureCanvas.width = 160;
        captureCanvas.height = 160;
        const ctx = captureCanvas.getContext("2d");
        ctx.drawImage(video, 0, 0, 160, 160);

        const imgData = ctx.getImageData(0, 0, 160, 160).data;
        const currentFeatures = extractFaceFeatures(imgData);

        if (currentFlowMode === "register") {
            // 顔登録の実行（当端末に記憶）
            saveRegisteredFaceData(scannedCardId, currentFeatures);
            stopCamera();
            
            document.getElementById("successDetail").textContent = `カード (${scannedCardId}) の顔登録が正常に完了しました。`;
            showScreen("screenSuccess");

            sendP2PData({
                type: "REGISTER_COMPLETE",
                cardId: scannedCardId
            });
        } else {
            // 顔認証の実行
            stopCamera();
            notify("顔認証を実行中...");

            const isMatch = verifyFaceFeatures(currentFeatures, registeredFaceFeatures);

            if (isMatch) {
                notify("認証成功！");
                document.getElementById("successDetail").textContent = `金額 ¥${Number(currentInputPrice).toLocaleString()} の顔認証決済が完了しました。`;
                showScreen("screenSuccess");

                sendP2PData({
                    type: "PAYMENT_COMPLETE",
                    amount: currentInputPrice
                });
            } else {
                notify("顔認証に失敗しました。登録顔データと一致しません。");
                setTimeout(() => { resetToHome(); }, 2000);
            }
        }
    }

    function extractFaceFeatures(pixelData) {
        let blockAverages = [];
        const blockSize = 16;
        for (let i = 0; i < pixelData.length; i += 4 * blockSize * blockSize) {
            let sum = 0;
            for (let j = 0; j < 4 * blockSize && (i + j) < pixelData.length; j += 4) {
                sum += pixelData[i + j];
            }
            blockAverages.push(Math.round(sum / blockSize));
        }
        return blockAverages;
    }

    function verifyFaceFeatures(featA, featB) {
        if (!featB || featA.length !== featB.length) {
            return true;
        }

        let dotProduct = 0;
        let normA = 0;
        let normB = 0;
        for (let i = 0; i < featA.length; i++) {
            dotProduct += featA[i] * featB[i];
            normA += featA[i] * featA[i];
            normB += featB[i] * featB[i];
        }
        const similarity = dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
        return similarity > 0.85;
    }

    function saveRegisteredFaceData(cardId, features) {
        registeredFaceFeatures = features;
        localStorage.setItem("tong_registered_card", cardId);
        localStorage.setItem("tong_face_features", JSON.stringify(features));
        notify("顔特徴データをローカルに保存しました");
    }

    function loadRegisteredFaceData() {
        const saved = localStorage.getItem("tong_face_features");
        if (saved) {
            registeredFaceFeatures = JSON.parse(saved);
        }
    }

    // --- 4. 画面・入力制御 ---
    function resetToHome() {
        stopCamera();
        cancelNfcScan();
        showScreen("screenHome");
        currentInputPrice = "0";
        document.getElementById("priceDisplay").textContent = "¥0";
    }

    function appendKey(val) {
        if (currentInputPrice === "0") {
            currentInputPrice = val === "00" ? "0" : val;
        } else {
            if (currentInputPrice.length < 7) {
                currentInputPrice += val;
            }
        }
        document.getElementById("priceDisplay").textContent = "¥" + Number(currentInputPrice).toLocaleString();
    }

    function clearKey() {
        currentInputPrice = "0";
        document.getElementById("priceDisplay").textContent = "¥0";
    }

    function submitPrice() {
        if (currentInputPrice === "0") {
            notify("金額を入力してください");
            return;
        }

        sendP2PData({
            type: "PAYMENT_REQUEST",
            amount: currentInputPrice
        });

        document.getElementById("nfcTitleText").textContent = "カード読み取り待機中";
        document.getElementById("nfcStatusText").textContent = "相手の端末で決済用NFCカードをかざしてください";
        showScreen("screenNfcTouch");
    }
</script>
