<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>TongAccount</title>
  <style>
    /* ロゴのスタイル（タップしやすいように cursor ポインターを指定） */
    .app-logo {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 書き込みモーダル／エリア（初期状態は非表示） */
    #nfcWriteArea {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #007bff;
      background-color: #f0f8ff;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- ① ロゴ要素（5回タップ対象） -->
  <h1 class="app-logo" id="appLogo" onclick="handleLogoTap()">TongAccount</h1>

  <!-- 既存のログインフォーム等 -->
  <div id="login-container">
    <form id="loginForm">
      <input type="text" id="userId" placeholder="ユーザーID" required>
      <input type="password" id="password" placeholder="パスワード" required>
      <button type="submit" id="submitBtn">ログイン</button>
    </form>
  </div>

  <!-- ② 情報表示エリア（NFCをかざすとここに表示） -->
  <div id="nfcInfoArea" style="margin-top:15px; font-weight:bold;"></div>

  <!-- ③ 隠し書き込みエリア（ロゴ5回タップで出現） -->
  <div id="nfcWriteArea">
    <h3>⚙️ NFC書き込みモード（管理者）</h3>
    <input type="text" id="nfcDataInput" placeholder="カードに書き込むデータ">
    <button onclick="writeNfcCard()">NFCカードに書き込む</button>
  </div>

  <script>
    /* ==========================================
       NFC読み取り ＆ 5回タップ書き込み機能
       ========================================== */
    
    var tapCount = 0;
    var tapTimer = null;

    // ページの読み込み完了時にNFC読み取りを開始
    document.addEventListener('DOMContentLoaded', function() {
      // ログインフォームの白画面防止登録
      var form = document.getElementById('loginForm');
      if (form) form.addEventListener('submit', handleLogin);

      // NFC自動読み取りの開始
      startNfcScan();
    });

    // --- 1. ロゴ5回タップ判定ロジック ---
    function handleLogoTap() {
      tapCount++;
      
      // 2秒間タップがなければカウントをリセット
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function() {
        tapCount = 0;
      }, 2000);

      // 5回タップ達成
      if (tapCount >= 5) {
        tapCount = 0;
        alert("🔒 管理者機能：NFC書き込みモードが有効化されました。");
        var writeArea = document.getElementById('nfcWriteArea');
        if (writeArea) {
          writeArea.style.display = 'block'; // 書き込み画面を表示
        }
      }
    }

    // --- 2. NFC読み取り機能 (Web NFC API) ---
    async function startNfcScan() {
      if ('NDEFReader' in window) {
        try {
          const ndef = new NDEFReader();
          await ndef.scan();
          
          ndef.addEventListener("reading", ({ message, serialNumber }) => {
            let nfcContent = "";
            for (const record of message.records) {
              const textDecoder = new TextDecoder(record.encoding);
              nfcContent += textDecoder.decode(record.data);
            }
            
            // 取得した情報を表示エリアに出力
            var infoArea = document.getElementById('nfcInfoArea');
            if (infoArea) {
              infoArea.innerText = "🎴 NFC読み取り成功: " + (nfcContent || ("ID: " + serialNumber));
            }

            // 必要に応じてGAS側へデータ送信
            /*
            google.script.run
              .withSuccessHandler(function(res){ ... })
              .processNfcData(nfcContent || serialNumber);
            */
          });
        } catch (error) {
          console.log("NFCスキャン開始エラー:", error);
        }
      } else {
        console.log("このブラウザ・端末はWeb NFCに対応していません。");
      }
    }

    // --- 3. NFC書き込み機能 ---
    async function writeNfcCard() {
      var inputData = document.getElementById('nfcDataInput').value;
      if (!inputData) {
        alert("書き込むデータを入力してください。");
        return;
      }

      if ('NDEFReader' in window) {
        try {
          const ndef = new NDEFReader();
          alert("書き込み準備完了：NFCカードを端末にかざしてください...");
          await ndef.write(inputData);
          alert("✅ NFCカードへの書き込みが完了しました！");
        } catch (error) {
          alert("書き込みに失敗しました: " + error.message);
        }
      } else {
        alert("この端末・ブラウザはNFC書き込みに対応していません。");
      }
    }

    // --- 既存のログイン処理（白画面防止版） ---
    function handleLogin(event) {
      if (event) event.preventDefault();
      var userId = document.getElementById('userId').value;
      var userPass = document.getElementById('password').value;
      var submitBtn = document.getElementById('submitBtn');

      if (submitBtn) submitBtn.disabled = true;

      google.script.run
        .withSuccessHandler(function(response) {
          if (submitBtn) submitBtn.disabled = false;
          if (response && response.success) {
            if (response.redirectUrl) window.open(response.redirectUrl, '_top');
            else window.top.location.reload();
          } else {
            alert(response ? response.message : "ログイン失敗");
          }
        })
        .withFailureHandler(function(error) {
          if (submitBtn) submitBtn.disabled = false;
          alert("通信エラー: " + (error.message || error));
        })
        .processLogin(userId, userPass);
    }
  </script>
</body>
</html>
