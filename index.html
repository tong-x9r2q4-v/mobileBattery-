<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>TongAccount NFC</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
      background-color: #f7f9fc;
    }
    /* ロゴ（5回タップ対象） */
    .app-logo {
      font-size: 32px;
      color: #007bff;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      margin-bottom: 20px;
    }
    /* カード情報表示エリア */
    .card-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto 20px;
    }
    #nfcStatus {
      font-size: 14px;
      color: #666;
    }
    #nfcData {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-top: 10px;
      word-break: break-all;
    }
    /* 隠し書き込みエリア（初期状態は非表示） */
    #nfcWriteArea {
      display: none;
      background: #eef6ff;
      border: 2px dashed #007bff;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: 0 auto;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:active {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- ① ロゴ要素（5回タップで裏モード解禁） -->
  <h1 class="app-logo" id="appLogo" onclick="handleLogoTap()">TongAccount</h1>

  <!-- ② 情報表示エリア（NFCをかざすと表示） -->
  <div class="card-box">
    <div id="nfcStatus">📲 NFCカードをかざしてください...</div>
    <div id="nfcData">---</div>
  </div>

  <!-- ③ 隠し書き込みエリア（5回タップで出現） -->
  <div id="nfcWriteArea">
    <h3 style="margin-top:0;">⚙️ NFC書き込みモード</h3>
    <input type="text" id="nfcInput" placeholder="書き込む文字列を入力">
    <br>
    <button onclick="writeNfcCard()">カードに書き込む</button>
  </div>

  <script>
    var tapCount = 0;
    var tapTimer = null;

    // ページ読み込み時にNFC読み取りを開始
    document.addEventListener('DOMContentLoaded', function() {
      startNfcScan();
    });

    // --- 1. ロゴ5回タップの判定 ---
    function handleLogoTap() {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function() {
        tapCount = 0;
      }, 2000); // 2秒以内の連打をカウント

      if (tapCount >= 5) {
        tapCount = 0;
        alert("🔒 書き込みモードが有効になりました。");
        document.getElementById('nfcWriteArea').style.display = 'block';
      }
    }

    // --- 2. NFC読み取り（Web NFC API） ---
    async function startNfcScan() {
      var statusEl = document.getElementById('nfcStatus');
      var dataEl = document.getElementById('nfcData');

      if ('NDEFReader' in window) {
        try {
          const ndef = new NDEFReader();
          await ndef.scan();
          statusEl.innerText = "✅ NFC待機中：カードを背面にかざしてください";

          ndef.addEventListener("reading", ({ message, serialNumber }) => {
            let nfcContent = "";
            for (const record of message.records) {
              const textDecoder = new TextDecoder(record.encoding);
              nfcContent += textDecoder.decode(record.data);
            }

            var textToShow = nfcContent || ("ID: " + serialNumber);
            dataEl.innerText = textToShow;
            statusEl.innerText = "🎴 読み取り成功！";

            // 必要に応じてGAS側に読み取りデータを送る場合
            google.script.run
              .withFailureHandler(function(err){ console.error(err); })
              .saveNfcLog(textToShow);
          });
        } catch (error) {
          statusEl.innerText = "❌ スキャン開始失敗: " + error.message;
        }
      } else {
        statusEl.innerText = "⚠️ この端末/ブラウザはWeb NFCに対応していません(Android Chrome等をご利用ください)";
      }
    }

    // --- 3. NFC書き込み ---
    async function writeNfcCard() {
      var textToWrite = document.getElementById('nfcInput').value;
      if (!textToWrite) {
        alert("書き込む文字を入力してください。");
        return;
      }

      if ('NDEFReader' in window) {
        try {
          const ndef = new NDEFReader();
          alert("NFCカードをスマホの背面にかざしてください...");
          await ndef.write(textToWrite);
          alert("🎉 書き込みが完了しました！");
        } catch (error) {
          alert("書き込み失敗: " + error.message);
        }
      } else {
        alert("この端末はNFC書き込みに対応していません。");
      }
    }
  </script>
</body>
</html>
