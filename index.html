<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かざしてP2P接続（相互承認版）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
    }
    h2 { margin-bottom: 1rem; font-size: 1.4rem; }
    p { font-size: 0.9rem; color: #94a3b8; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 0.5rem;
      cursor: pointer;
      margin-top: 1rem;
      width: 100%;
    }
    .btn-success { background: #22c55e; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    #qrcode { display: flex; justify-content: center; margin: 1rem 0; background: white; padding: 12px; border-radius: 8px; }
    
    #reader-wrapper {
      width: 100%;
      margin-top: 1rem;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      display: none;
    }
    #reader { width: 100%; }

    .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 0.8rem; display: none; }
    
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 50px; height: 50px;
      border-radius: 50%;
      border-left-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin: 1.5rem auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 共通確認コード表示 */
    .code-box {
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 0.3rem;
      color: #38bdf8;
      background: #0f172a;
      padding: 0.6rem;
      border-radius: 0.5rem;
      margin: 1rem 0;
    }

    /* チェックマーク */
    .checkmark-svg {
      width: 80px; height: 80px;
      margin: 1rem auto;
      stroke: #22c55e; stroke-width: 3; stroke-miterlimit: 10;
      animation: scale .3s ease-in-out forwards;
    }
    .checkmark-circle { stroke-dasharray: 166; stroke-dashoffset: 166; animation: stroke 0.6s forwards; }
    .checkmark-check { stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s 0.6s forwards; }
    @keyframes stroke { 100% { stroke-dashoffset: 0; } }
    @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
  </style>
</head>
<body>

  <div class="card">
    <!-- ステップ 1: QR表示 / スキャン選択 -->
    <div id="step-init">
      <h2>P2P かざして接続</h2>
      <p>デスクトップでQRを表示し、スマホで読み取ってください</p>
      
      <div id="qrcode"></div>
      <p style="font-size: 0.8rem; color: #64748b;">自端末ID: <span id="my-peer-id">取得中...</span></p>
      
      <button class="btn" id="start-cam-btn" onclick="startCameraScanner()">📷 スマホでQRを読み取る</button>
      
      <div id="reader-wrapper">
        <div id="reader"></div>
      </div>
      <p class="error-msg" id="cam-error"></p>
    </div>

    <!-- ステップ 2: 接続中 -->
    <div id="step-connecting" style="display: none;">
      <h2>接続中...</h2>
      <div class="spinner"></div>
      <p>P2P通信を確立しています</p>
    </div>

    <!-- ステップ 3: 確認コード ＆ 相互信頼 -->
    <div id="step-verify" style="display: none;">
      <h2>接続コードの確認</h2>
      <p>両方の端末に以下の<b>同じコード</b>が表示されているか確認してください</p>
      
      <div class="code-box" id="display-code">------</div>
      
      <button class="btn btn-success" id="approve-btn" onclick="approveConnection()">信頼します</button>
      <p id="wait-status" style="margin-top: 1rem; color: #38bdf8; display: none;">相手の承認を待っています...</p>
    </div>

    <!-- ステップ 4: 相互承認完了（チェックマーク表示） -->
    <div id="step-success" style="display: none;">
      <svg class="checkmark-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle class="checkmark-circle" cx="26" cy="26" r="23" fill="none"/>
        <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
      <h2>接続完了</h2>
      <p>両方の端末で信頼が確認されました！</p>
    </div>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let html5QrCode = null;
    
    let confirmCode = "";
    let isHost = false; // QRコードを表示した側（ホスト）かどうか
    let myApproved = false; // 自分が承認したか
    let peerApproved = false; // 相手が承認したか

    function showStep(stepId) {
      ['step-init', 'step-connecting', 'step-verify', 'step-success'].forEach(id => {
        document.getElementById(id).style.display = (id === stepId) ? 'block' : 'none';
      });
    }

    function generateCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('my-peer-id').innerText = id;
      new QRCode(document.getElementById("qrcode"), {
        text: id,
        width: 160,
        height: 160
      });
    });

    // 【ホスト側（デスクトップ）】接続要求を受け取る
    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      isHost = true;
      
      // ホスト側が一意の共通コードを生成
      confirmCode = generateCode();
      
      showStep('step-connecting');
      setupConnectionHandlers();
    });

    // 【スキャン側（スマホ）】カメラ起動
    async function startCameraScanner() {
      document.getElementById('cam-error').style.display = 'none';
      document.getElementById('start-cam-btn').style.display = 'none';
      document.getElementById('reader-wrapper').style.display = 'block';

      html5QrCode = new Html5Qrcode("reader");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 220, height: 220 } },
          onScanSuccess
        );
      } catch (err) {
        console.error(err);
        document.getElementById('cam-error').innerText = "❌ カメラ起動失敗。HTTPS環境であることを確認してください。";
        document.getElementById('cam-error').style.display = 'block';
        document.getElementById('start-cam-btn').style.display = 'block';
        document.getElementById('reader-wrapper').style.display = 'none';
      }
    }

    function onScanSuccess(targetPeerId) {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          showStep('step-connecting');
          
          isHost = false;
          conn = peer.connect(targetPeerId);
          setupConnectionHandlers();
        });
      }
    }

    // P2Pデータ通信のセットアップ
    function setupConnectionHandlers() {
      conn.on('open', () => {
        if (isHost) {
          // ホスト側から相手へ「共通コード」を送信
          conn.send({ type: 'INIT_CODE', code: confirmCode });
          showVerifyScreen(confirmCode);
        }
      });

      conn.on('data', (data) => {
        // 共通コードを受け取る（スマホ側）
        if (data.type === 'INIT_CODE') {
          confirmCode = data.code;
          showVerifyScreen(confirmCode);
        } 
        // 相手が承認ボタンを押した通知
        else if (data.type === 'APPROVE') {
          peerApproved = true;
          checkBothApproved();
        }
      });
    }

    function showVerifyScreen(code) {
      document.getElementById('display-code').innerText = code;
      showStep('step-verify');
    }

    // 自分が「信頼します」を押したとき
    function approveConnection() {
      myApproved = true;
      
      // ボタン無効化 ＆ 待機メッセージ表示
      const btn = document.getElementById('approve-btn');
      btn.disabled = true;
      btn.innerText = "承認済み";
      document.getElementById('wait-status').style.display = 'block';

      // 相手に承認通知を送信
      conn.send({ type: 'APPROVE' });

      checkBothApproved();
    }

    // 両方が承認したかチェック
    function checkBothApproved() {
      if (myApproved && peerApproved) {
        showStep('step-success');
      }
    }
  </script>
</body>
</html>
