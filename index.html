<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>決済＆認証システム</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 1.25rem;
      color: #1a1a1a;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      background-color: #e0e0e0;
      color: #666;
    }
    .status-badge.online {
      background-color: #e6f4ea;
      color: #137333;
    }
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }
    .price-display {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 20px 0;
      color: #007aff;
    }
    /* テンキーUI */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 15px;
    }
    .key-btn {
      padding: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      background: #f0f2f5;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .key-btn:active {
      background: #e1e4e8;
    }
    .btn-action {
      background: #007aff;
      color: white;
    }
    .btn-action:active {
      background: #0056b3;
    }
    .btn-clear {
      background: #ff3b30;
      color: white;
    }
    .btn-clear:active {
      background: #d70015;
    }
    /* パスワードドット表示 */
    .pass-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }
    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #ccc;
    }
    .dot.filled {
      background: #007aff;
      border-color: #007aff;
    }
    /* 完了表示 */
    .success-icon {
      width: 64px;
      height: 64px;
      background: #34c759;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px auto;
    }
    .card-prompt {
      border: 2px dashed #007aff;
      padding: 30px 20px;
      border-radius: 12px;
      margin-top: 15px;
      background: #f0f8ff;
    }
    .config-box {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }
    .input-field {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="connectionStatus" class="status-badge">接続待機中...</div>

  <!-- 【Android 非対応環境】 案内端末画面 -->
  <div id="screenAndroidUnsupported" class="screen">
    <h2>案内端末</h2>
    <div id="unsupportedGuide" class="card-prompt">
      <p style="font-size: 1.1rem; color: #666;">iPhoneで価格を入力してください</p>
    </div>
  </div>

  <!-- 【Android 対応環境】 読み取り機画面 -->
  <div id="screenAndroidSupported" class="screen">
    <h2>ICカード読み取り機</h2>
    <div id="supportedGuide">
      <p style="font-size: 1.1rem; color: #666; margin-bottom: 10px;">タッチを待機中...</p>
      <div id="readAmountDisplay" class="price-display">￥0</div>
      <button class="key-btn btn-action" style="width: 100%;" onclick="simulateCardTouch()">[デモ] カードをかざす</button>
    </div>
  </div>

  <!-- 【iPhone】 決済・テンキー入力・パスワード画面 -->
  <div id="screenIPhone" class="screen">
    <h2 id="iphoneHeader">価格入力</h2>
    
    <!-- モード1: 価格入力 -->
    <div id="iphoneModePrice">
      <div id="priceDisplay" class="price-display">￥0</div>
      <div class="keypad">
        <button class="key-btn" onclick="appendPrice('1')">1</button>
        <button class="key-btn" onclick="appendPrice('2')">2</button>
        <button class="key-btn" onclick="appendPrice('3')">3</button>
        <button class="key-btn" onclick="appendPrice('4')">4</button>
        <button class="key-btn" onclick="appendPrice('5')">5</button>
        <button class="key-btn" onclick="appendPrice('6')">6</button>
        <button class="key-btn" onclick="appendPrice('7')">7</button>
        <button class="key-btn" onclick="appendPrice('8')">8</button>
        <button class="key-btn" onclick="appendPrice('9')">9</button>
        <button class="key-btn btn-clear" onclick="clearPrice()">C</button>
        <button class="key-btn" onclick="appendPrice('0')">0</button>
        <button class="key-btn btn-action" onclick="submitPrice()">送信</button>
      </div>
      <div class="config-box">
        <button class="key-btn" style="width:100%; font-size:0.9rem;" onclick="showPasswordSettings()">パスワード変更設定</button>
      </div>
    </div>

    <!-- モード2: パスワード入力 -->
    <div id="iphoneModePassword" style="display: none;">
      <p>パスワードを入力してください</p>
      <div class="pass-dots">
        <div class="dot" id="dot0"></div>
        <div class="dot" id="dot1"></div>
        <div class="dot" id="dot2"></div>
        <div class="dot" id="dot3"></div>
      </div>
      <div class="keypad">
        <button class="key-btn" onclick="appendPass('1')">1</button>
        <button class="key-btn" onclick="appendPass('2')">2</button>
        <button class="key-btn" onclick="appendPass('3')">3</button>
        <button class="key-btn" onclick="appendPass('4')">4</button>
        <button class="key-btn" onclick="appendPass('5')">5</button>
        <button class="key-btn" onclick="appendPass('6')">6</button>
        <button class="key-btn" onclick="appendPass('7')">7</button>
        <button class="key-btn" onclick="appendPass('8')">8</button>
        <button class="key-btn" onclick="appendPass('9')">9</button>
        <button class="key-btn btn-clear" onclick="clearPass()">C</button>
        <button class="key-btn" onclick="appendPass('0')">0</button>
      </div>
    </div>

    <!-- モード3: パスワード設定 -->
    <div id="iphoneModeConfig" style="display: none;">
      <h3>パスワード変更</h3>
      <input type="password" id="newPasswordInput" class="input-field" placeholder="新しい4桁のパスワード" maxlength="4">
      <button class="key-btn btn-action" style="width:100%; margin-top:10px;" onclick="saveNewPassword()">保存</button>
      <button class="key-btn" style="width:100%; margin-top:5px;" onclick="cancelPasswordSettings()">キャンセル</button>
    </div>

    <!-- モード4: 完了画面 -->
    <div id="iphoneModeSuccess" style="display: none;">
      <div class="success-icon">✓</div>
      <h3 style="font-size: 1.5rem; margin-bottom: 10px;">ありがとうございます</h3>
      <p style="color: #666;">決済が正常に完了しました</p>
    </div>
  </div>

</div>

<script>
  // システム状態定義
  let peer = null;
  let conn = null;
  let currentPassword = "4748"; // 初期パスワード
  let enteredPassword = "";
  let currentPrice = "0";
  let isNFCSupported = false;
  let isIOS = false;

  // 初期化処理（自動環境判定）
  window.addEventListener('DOMContentLoaded', () => {
    detectEnvironment();
    initPeer();
  });

  // OS・環境判定関数
  function detectEnvironment() {
    const ua = navigator.userAgent;
    isIOS = /iPhone|iPad|iPod/i.test(ua);
    // NFC対応機能（Web NFC）の有無判定
    isNFCSupported = ('NDEFReader' in window);

    // 画面の初期非表示（自動判定に必要なUI以外は出さない）
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

    if (isIOS) {
      document.getElementById('screenIPhone').classList.add('active');
    } else {
      if (isNFCSupported) {
        document.getElementById('screenAndroidSupported').classList.add('active');
      } else {
        document.getElementById('screenAndroidUnsupported').classList.add('active');
      }
    }
  }

  // PeerJS 通信初期化 (固定ID 4748 連携用)
  function initPeer() {
    const statusEl = document.getElementById('connectionStatus');
    
    // iPhone側はクライアント、Android側をホスト（4748）として通信確立
    if (!isIOS) {
      peer = new Peer('4748-host-device');
      peer.on('open', (id) => {
        statusEl.textContent = "接続待機中 (ホスト)";
      });
      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
      });
    } else {
      peer = new Peer();
      peer.on('open', () => {
        statusEl.textContent = "接続試行中...";
        conn = peer.connect('4748-host-device');
        setupConnection();
      });
    }

    peer.on('error', (err) => {
      console.log('PeerJS Error: ', err);
      statusEl.textContent = "オフライン動作中";
    });
  }

  function setupConnection() {
    const statusEl = document.getElementById('connectionStatus');
    statusEl.textContent = "接続完了";
    statusEl.classList.add('online');

    conn.on('data', (data) => {
      handleIncomingData(data);
    });
  }

  // 受信データのハンドリング
  function handleIncomingData(data) {
    if (data.type === 'PRICE_SET') {
      currentPrice = data.value;
      if (!isIOS) {
        if (!isNFCSupported) {
          // 非対応環境案内表示
          document.getElementById('unsupportedGuide').innerHTML = `
            <p style="font-size:0.9rem; color:#666;">価格: ￥${currentPrice}</p>
            <p style="font-size:1.3rem; font-weight:bold; color:#007aff; margin-top:10px;">
              価格とカードをかざしてください
            </p>
          `;
        } else {
          // 対応環境読み取り機表示
          document.getElementById('readAmountDisplay').textContent = `￥${currentPrice}`;
        }
      }
    } else if (data.type === 'CARD_TOUCHED') {
      if (isIOS) {
        // カード読み取り通知を受け取ったらパスワード入力へ
        showPasswordInput();
      }
    } else if (data.type === 'PAYMENT_COMPLETE') {
      if (!isIOS) {
        if (isNFCSupported) {
          document.getElementById('readAmountDisplay').textContent = "￥0";
          alert("決済が完了しました");
        } else {
          document.getElementById('unsupportedGuide').innerHTML = `
            <div class="success-icon">✓</div>
            <p style="font-size: 1.2rem; font-weight:bold;">ありがとうございます</p>
          `;
          setTimeout(() => {
            document.getElementById('unsupportedGuide').innerHTML = `
              <p style="font-size: 1.1rem; color: #666;">iPhoneで価格を入力してください</p>
            `;
          }, 3000);
        }
      }
    }
  }

  // --- iPhone: テンキー入力処理 ---
  function appendPrice(num) {
    if (currentPrice === "0") {
      currentPrice = num;
    } else {
      currentPrice += num;
    }
    document.getElementById('priceDisplay').textContent = `￥${currentPrice}`;
  }

  function clearPrice() {
    currentPrice = "0";
    document.getElementById('priceDisplay').textContent = `￥${currentPrice}`;
  }

  function submitPrice() {
    if (currentPrice === "0") return;

    if (conn && conn.open) {
      conn.send({ type: 'PRICE_SET', value: currentPrice });
    }

    // 非対応環境のiPhoneの場合は直接パスワード入力画面へ（対応環境では読み取りシグナルを待つ）
    if (!isNFCSupported && !isIOS) {
      // Android側の画面切り替えロジック
    } else if (isIOS) {
      // 相手端末のタイプに応じて即時またはタッチ待機
      showPasswordInput();
    }
  }

  // --- パスワード照合ロジック ---
  function showPasswordInput() {
    document.getElementById('iphoneHeader').textContent = "認証";
    document.getElementById('iphoneModePrice').style.display = 'none';
    document.getElementById('iphoneModePassword').style.display = 'block';
    enteredPassword = "";
    updateDots();
  }

  function appendPass(num) {
    if (enteredPassword.length < 4) {
      enteredPassword += num;
      updateDots();
    }
    if (enteredPassword.length === 4) {
      setTimeout(verifyPassword, 200);
    }
  }

  function clearPass() {
    enteredPassword = "";
    updateDots();
  }

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById(`dot${i}`);
      if (i < enteredPassword.length) {
        dot.classList.add('filled');
      } else {
        dot.classList.remove('filled');
      }
    }
  }

  function verifyPassword() {
    if (enteredPassword === currentPassword) {
      // パスワード一致
      document.getElementById('iphoneModePassword').style.display = 'none';
      document.getElementById('iphoneModeSuccess').style.display = 'block';
      document.getElementById('iphoneHeader').textContent = "完了";

      if (conn && conn.open) {
        conn.send({ type: 'PAYMENT_COMPLETE' });
      }

      setTimeout(() => {
        // リセット処理
        document.getElementById('iphoneModeSuccess').style.display = 'none';
        document.getElementById('iphoneModePrice').style.display = 'block';
        document.getElementById('iphoneHeader').textContent = "価格入力";
        clearPrice();
        enteredPassword = "";
      }, 3000);
    } else {
      alert("パスワードが正しくありません");
      clearPass();
    }
  }

  // --- パスワード変更設定 ---
  function showPasswordSettings() {
    document.getElementById('iphoneModePrice').style.display = 'none';
    document.getElementById('iphoneModeConfig').style.display = 'block';
  }

  function saveNewPassword() {
    const newPass = document.getElementById('newPasswordInput').value;
    if (newPass.length === 4 && /^\d+$/.test(newPass)) {
      currentPassword = newPass;
      alert("パスワードを変更しました");
      cancelPasswordSettings();
    } else {
      alert("4桁の数字を入力してください");
    }
  }

  function cancelPasswordSettings() {
    document.getElementById('newPasswordInput').value = "";
    document.getElementById('iphoneModeConfig').style.display = 'none';
    document.getElementById('iphoneModePrice').style.display = 'block';
  }

  // --- デモ用: カード読み取りシミュレート ---
  function simulateCardTouch() {
    if (currentPrice === "0") {
      alert("価格が設定されていません");
      return;
    }
    alert("カードが読み取られました。iPhoneでパスワードを入力してください。");
    if (conn && conn.open) {
      conn.send({ type: 'CARD_TOUCHED' });
    }
  }
</script>

</body>
</html>
