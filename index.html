<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>P2Pラジオ配信システム</title>
  <!-- PeerJS ライブラリの読み込み -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    .status { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>P2P ラジオシステム</h1>

  <div>
    <label for="passInput">配信者コード (リスナーは空欄のまま):</label><br>
    <input type="password" id="passInput" placeholder="0000">
    <button id="joinBtn">参加</button>
  </div>

  <div id="status" class="status">状態: 未接続</div>

  <!-- リスナーが音声を聞くための audio タグ -->
  <audio id="remoteAudio" autoplay controls style="margin-top: 20px; display: none;"></audio>

  <script>
    const TARGET_ID = '5326'; // 固定配信ID
    const joinBtn = document.getElementById('joinBtn');
    const passInput = document.getElementById('passInput');
    const statusDiv = document.getElementById('status');
    const remoteAudio = document.getElementById('remoteAudio');

    let peer = null;
    let localStream = null;
    let activeCall = null; // 現在接続中の通話オブジェクト

    joinBtn.addEventListener('click', async () => {
      const code = passInput.value.trim();
      joinBtn.disabled = true;

      if (code === '0000') {
        // --- 配信者処理 ---
        statusDiv.textContent = '状態: マイクを準備中...';
        try {
          // マイク音声の取得
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          
          // ID「5326」でPeerを初期化
          peer = new Peer(TARGET_ID);

          peer.on('open', (id) => {
            statusDiv.textContent = `状態: 配信中 (ID: ${id}) - リスナーの接続を待っています...`;
          });

          // リスナーからの着信処理
          peer.on('call', (call) => {
            // リスナー制限: すでに誰か接続している場合は切断して拒否
            if (activeCall) {
              call.close();
              return;
            }

            // 1人目のリスナーを着信許可し、自分のマイク音声を送る
            call.answer(localStream);
            activeCall = call;
            statusDiv.textContent = '状態: 配信中 (リスナーが1人聴取中)';

            // リスナーが切断したときの処理
            call.on('close', () => {
              activeCall = null;
              statusDiv.textContent = '状態: 配信中 - リスナーの接続を待っています...';
            });
            call.on('error', () => {
              activeCall = null;
              statusDiv.textContent = '状態: 配信中 - リスナーの接続を待っています...';
            });
          });

          peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
              statusDiv.textContent = 'エラー: ID 5326 はすでに使われています（既に配信者が存在します）';
            } else {
              statusDiv.textContent = `エラー: ${err.message}`;
            }
            joinBtn.disabled = false;
          });

        } catch (err) {
          statusDiv.textContent = 'エラー: マイクの取得に失敗しました';
          joinBtn.disabled = false;
        }

      } else {
        // --- リスナー処理 ---
        statusDiv.textContent = '状態: 配信者(5326)に接続中...';
        
        // ランダムなIDで自分のPeerを生成
        peer = new Peer();

        peer.on('open', () => {
          // ダミーの空ストリームまたは受信のみでCallを発信
          // PeerJSではMediaStreamを渡す必要があるため、空のMediaStreamを作成
          const emptyStream = new MediaStream();
          const call = peer.call(TARGET_ID, emptyStream);

          if (!call) {
            statusDiv.textContent = 'エラー: 接続を送信できませんでした';
            joinBtn.disabled = false;
            return;
          }

          // 配信者から音声が送られてきたとき
          call.on('stream', (remoteStream) => {
            remoteAudio.srcObject = remoteStream;
            remoteAudio.style.display = 'block';
            statusDiv.textContent = '状態: ラジオを受信中';
          });

          call.on('close', () => {
            statusDiv.textContent = '状態: 配信が終了したか、満員（1人制限）のため切断されました';
            remoteAudio.style.display = 'none';
            joinBtn.disabled = false;
          });

          call.on('error', (err) => {
            statusDiv.textContent = `エラー: ${err.message}`;
            joinBtn.disabled = false;
          });
        });

        peer.on('error', (err) => {
          statusDiv.textContent = 'エラー: 配信者(5326)が見つからないか、接続できませんでした';
          joinBtn.disabled = false;
        });
      }
    });
  </script>
</body>
</html>
