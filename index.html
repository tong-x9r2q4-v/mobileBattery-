<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 検索エンジンに登録（インデックス）させないための記述 -->
    <meta name="robots" content="noindex, nofollow">
    <title>Tong リアルP2P ＆ 実機認証システム</title>

    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- tracking.js (Webブラウザ用 軽量リアルタイム顔検出ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-tag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #334155;
            color: var(--text-sub);
        }
        .status-tag.online {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        /* 画面切り替え要素 */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* ボタン共通 */
        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            margin-top: 10px;
        }
        .btn-secondary:hover {
            border-color: var(--text-sub);
            color: var(--text-main);
            background-color: transparent;
        }

        .home-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        /* 入力ボックス */
        .input-box {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 1px;
            outline: none;
            margin: 12px 0;
        }

        .my-id-card {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 16px;
            text-align: center;
            word-break: break-all;
        }

        /* テンキー計算機 */
        .display-val {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: right;
            margin-bottom: 16px;
            color: var(--text-main);
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .key-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 600;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .key-btn:active { background-color: var(--border-color); }

        /* NFC タッチ画面 */
        .touch-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            margin: 20px 0;
            background-color: rgba(56, 189, 248, 0.05);
            text-align: center;
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* カメラ ＆ 顔認識ビュー */
        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            margin: 16px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        canvas.face-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }
        .face-overlay-guide {
            position: absolute;
            width: 140px;
            height: 180px;
            border: 2px dashed var(--accent-color);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
        }

        /* 完了画面 */
        .success-box {
            text-align: center;
            padding: 30px 10px;
        }
        .checkmark {
            font-size: 4rem;
            color: var(--success-color);
            margin-bottom: 12px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* トースト通知 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            background-color: var(--panel-bg);
            border-left: 4px solid var(--accent-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            max-width: 80%;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div id="notification" class="notification">通知メッセージ</div>

<div class="container">
    <div class="panel">
        <div class="panel-title">
            <span>Tong 実機P2Pシステム</span>
            <span id="p2pStatusTag" class="status-tag">オフライン</span>
        </div>

        <!-- 1. 初期メニュー画面 -->
        <div id="screenHome" class="screen active">
            <p style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 12px;">処理を選択してください。</p>
            <div class="home-menu">
                <button class="btn" onclick="startPaymentFlow()">💳 決済機能を開始</button>
                <button class="btn btn-secondary" onclick="startFaceRegisterFlow()">👤 顔登録を開始</button>
            </div>
        </div>

        <!-- 2. PeerJS P2P 接続画面 -->
        <div id="screenPairing" class="screen">
            <div class="my-id-card">
                <div style="font-size: 0.8rem; color: var(--text-sub);">あなたのPeer ID</div>
                <strong id="myPeerIdDisplay" style="font-size: 1.1rem; color: var(--accent-color);">発行中...</strong>
            </div>

            <p style="font-size: 0.85rem; color: var(--text-sub); text-align: center;">連携相手（Android端末）のPeer IDを入力してください</p>
            <input type="text" id="remotePeerIdInput" class="input-box" placeholder="相手のPeer IDを入力">
            <button class="btn" onclick="connectToRemotePeer()">P2Pペアリング接続</button>
            <button class="btn btn-secondary" onclick="resetToHome()">キャンセル</button>
        </div>

        <!-- 3. 価格入力テンキー画面 -->
        <div id="screenKeypad" class="screen">
            <div class="display-val" id="priceDisplay">¥0</div>
            <div class="keypad">
                <button class="key-btn" onclick="appendKey('1')">1</button>
                <button class="key-btn" onclick="appendKey('2')">2</button>
                <button class="key-btn" onclick="appendKey('3')">3</button>
                <button class="key-btn" onclick="appendKey('4')">4</button>
                <button class="key-btn" onclick="appendKey('5')">5</button>
                <button class="key-btn" onclick="appendKey('6')">6</button>
                <button class="key-btn" onclick="appendKey('7')">7</button>
                <button class="key-btn" onclick="appendKey('8')">8</button>
                <button class="key-btn" onclick="appendKey('9')">9</button>
                <button class="key-btn" onclick="clearKey()">C</button>
                <button class="key-btn" onclick="appendKey('0')">0</button>
                <button class="key-btn" onclick="appendKey('00')">00</button>
            </div>
            <button class="btn" style="margin-top: 16px;" onclick="submitPrice()">決済（カード読み取りへ）</button>
        </div>

        <!-- 4. NFC カード読み取り待ち画面 (Web NFC API使用) -->
        <div id="screenNfcTouch" class="screen">
            <div class="touch-zone">
                <div class="card-icon">💳</div>
                <div style="font-weight: bold; font-size: 1.1rem; color: var(--accent-color); margin-bottom: 8px;">端末で読み取ってください</div>
                <div style="font-size: 0.85rem; color: var(--text-main);" id="nfcStatusText">スマホ背面にNFCカードを近づけてください</div>
            </div>
            <button class="btn btn-secondary" onclick="cancelNfcScan(); resetToHome();">中断</button>
        </div>

        <!-- 5. 顔認証/顔登録用 カメラ＆検知画面 -->
        <div id="screenFaceCamera" class="screen">
            <div style="text-align: center; font-weight: bold; color: var(--accent-color); margin-bottom: 8px;" id="cameraGuideText">顔をカメラ枠内に合わせてください</div>
            <div class="camera-wrapper">
                <video id="videoFeed" autoplay playsinline muted></video>
                <canvas id="faceCanvas" class="face-canvas"></canvas>
                <div class="face-overlay-guide"></div>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-sub); text-align: center; margin-bottom: 8px;" id="faceDetectStatus">顔を検出しています...</div>
            <button class="btn" id="actionCamBtn" onclick="onCameraActionClick()" disabled>顔認証を実行</button>
            <button class="btn btn-secondary" onclick="stopCamera(); resetToHome();">キャンセル</button>
        </div>

        <!-- 6. 完了画面 -->
        <div id="screenSuccess" class="screen">
            <div class="success-box">
                <div class="checkmark">✔</div>
                <h3 style="margin-bottom: 8px;">処理完了</h3>
                <p style="font-size: 0.85rem; color: var(--text-sub);" id="successDetail">処理が正しく完了しました。</p>
            </div>
            <button class="btn" onclick="resetToHome()">ホームに戻る</button>
        </div>
    </div>
</div>

<script>
    // --- グローバル変数 ---
    let peer = null;
    let conn = null;
    let currentInputPrice = "0";
    let scannedCardId = null;

    // NFC関連
    let nfcNDEFReader = null;
    let nfcAbortController = null;

    // カメラ ＆ 顔検知関連
    let currentStream = null;
    let trackingTask = null;
    let isFaceDetected = false;
    let currentCameraMode = "auth"; // "auth" | "register"
    let registeredFaceFeatures = null; // ローカル記憶される登録済み顔特徴データ

    // DOM読み込み時の初期化
    document.addEventListener("DOMContentLoaded", () => {
        initPeerJS();
        loadRegisteredFaceData();
    });

    // 画面切替共通処理
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        const target = document.getElementById(screenId);
        if (target) target.classList.add('active');
    }

    // トースト表示
    function notify(msg) {
        const el = document.getElementById("notification");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, 3500);
    }

    // --- 1. PeerJS 実機 P2P 通信処理 ---
    function initPeerJS() {
        // PeerJS サーバーへ接続しランダムID生成
        peer = new Peer();

        peer.on('open', (id) => {
            console.log("My Peer ID:", id);
            document.getElementById("myPeerIdDisplay").textContent = id;
            updateP2PStatus(false);
        });

        // リモート側からの接続受信処理
        peer.on('connection', (c) => {
            conn = c;
            setupP2PConnectionHandlers();
            notify("P2P接続要求を受信し、連携完了しました");
        });

        peer.on('error', (err) => {
            console.error("PeerJS Error:", err);
            notify("P2P通信エラー: " + err.type);
        });
    }

    function connectToRemotePeer() {
        const remoteId = document.getElementById("remotePeerIdInput").value.trim();
        if (!remoteId) {
            notify("相手のPeer IDを入力してください");
            return;
        }

        notify("接続中...");
        conn = peer.connect(remoteId);
        setupP2PConnectionHandlers();
    }

    function setupP2PConnectionHandlers() {
        conn.on('open', () => {
            updateP2PStatus(true);
            notify("P2P端末接続が成功しました！");
            if (document.getElementById("screenPairing").classList.contains("active")) {
                showScreen("screenKeypad");
            }
        });

        conn.on('data', (data) => {
            console.log("P2P Data Received:", data);
            handleIncomingP2PData(data);
        });

        conn.on('close', () => {
            updateP2PStatus(false);
            notify("P2P接続が切断されました");
        });
    }

    function updateP2PStatus(isConnected) {
        const tag = document.getElementById("p2pStatusTag");
        if (isConnected) {
            tag.textContent = "P2P接続完了";
            tag.classList.add("online");
        } else {
            tag.textContent = "未接続";
            tag.classList.remove("online");
        }
    }

    // P2P 受信メッセージ制御
    function handleIncomingP2PData(data) {
        if (data.type === "PAYMENT_REQUEST") {
            notify(`決済リクエスト受信: ¥${data.amount}`);
            currentInputPrice = data.amount;
            startNfcScanForPayment();
        } else if (data.type === "PAYMENT_COMPLETE") {
            document.getElementById("successDetail").textContent = `金額 ¥${Number(data.amount).toLocaleString()} の顔認証P2P決済が完了しました。`;
            showScreen("screenSuccess");
        }
    }

    function sendP2PData(data) {
        if (conn && conn.open) {
            conn.send(data);
        } else {
            console.warn("P2P未接続のためメッセージを直接処理します");
        }
    }

    // --- 2. Web NFC API 実機カード読み取り機能 ---
    async function startNfcScan(onSuccessCallback) {
        document.getElementById("nfcStatusText").textContent = "スマホ背面にNFCカードを近づけてください";

        if (!('NDEFReader' in window)) {
            // Web NFC非対応ブラウザ（PC等）の場合の代替タップ認識フォールバック
            notify("Web NFC非対応ブラウザです。画面タップでシミュレート読み取りを行います。");
            document.getElementById("nfcStatusText").textContent = "【非対応端末】ここをタップしてカード認識";
            document.getElementById("screenNfcTouch").onclick = () => {
                document.getElementById("screenNfcTouch").onclick = null;
                onSuccessCallback("NFC-CARD-REAL-SIMULATED-9901");
            };
            return;
        }

        try {
            nfcAbortController = new AbortController();
            nfcNDEFReader = new NDEFReader();

            await nfcNDEFReader.scan({ signal: nfcAbortController.signal });
            notify("NFC読み取り待機中...");

            nfcNDEFReader.addEventListener("readingerror", () => {
                notify("NFCカードの読み取りに失敗しました。もう一度かざしてください。");
            });

            nfcNDEFReader.addEventListener("reading", ({ serialNumber }) => {
                console.log("NFC Serial Number:", serialNumber);
                notify(`NFC読み取り成功 (ID: ${serialNumber})`);
                cancelNfcScan();
                onSuccessCallback(serialNumber || "NFC-CARD-DEFAULT-ID");
            });

        } catch (error) {
            console.error("NFC Error:", error);
            notify("NFC起動エラー: " + error.message);
        }
    }

    function cancelNfcScan() {
        if (nfcAbortController) {
            nfcAbortController.abort();
            nfcAbortController = null;
        }
    }

    // --- 3. tracking.js によるリアルタイム顔検出 ＆ 画像解析認証 ---

    async function startCameraAndFaceDetection(mode) {
        currentCameraMode = mode;
        showScreen("screenFaceCamera");

        const video = document.getElementById("videoFeed");
        const canvas = document.getElementById("faceCanvas");
        const context = canvas.getContext("2d");
        const actionBtn = document.getElementById("actionCamBtn");
        const guideText = document.getElementById("cameraGuideText");
        const detectStatus = document.getElementById("faceDetectStatus");

        actionBtn.disabled = true;
        isFaceDetected = false;

        if (mode === "auth") {
            guideText.textContent = "【顔認証】カメラ枠内に顔を合わせてください";
            actionBtn.textContent = "顔認証を行って決済";
        } else {
            guideText.textContent = "【顔登録】正面を向いて撮影してください";
            actionBtn.textContent = "この顔情報を登録";
        }

        try {
            // カメラ起動
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
                audio: false
            });
            currentStream = stream;
            video.srcObject = stream;

            // tracking.js の FaceTracker 初期化
            const tracker = new tracking.ObjectTracker('face');
            tracker.setInitialScale(4);
            tracker.setStepSize(2);
            tracker.setEdgesDensity(0.1);

            trackingTask = tracking.track('#videoFeed', tracker);

            tracker.on('track', (event) => {
                context.clearRect(0, 0, canvas.width, canvas.height);

                if (event.data.length === 0) {
                    isFaceDetected = false;
                    detectStatus.textContent = "顔を探しています...";
                    detectStatus.style.color = "var(--text-sub)";
                    actionBtn.disabled = true;
                } else {
                    isFaceDetected = true;
                    detectStatus.textContent = "✔ 顔を検出しました！認証可能です";
                    detectStatus.style.color = "var(--success-color)";
                    actionBtn.disabled = false;

                    // 検出枠のリアルタイム描画
                    event.data.forEach((rect) => {
                        context.strokeStyle = '#38bdf8';
                        context.lineWidth = 3;
                        context.strokeRect(rect.x, rect.y, rect.width, rect.height);
                    });
                }
            });

        } catch (err) {
            console.error("Camera Error:", err);
            notify("カメラのアクセスに失敗しました");
        }
    }

    function stopCamera() {
        if (trackingTask) {
            trackingTask.stop();
            trackingTask = null;
        }
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
    }

    // カメラボタンクリック時処理
    function onCameraActionClick() {
        if (!isFaceDetected) {
            notify("顔が検出されていません");
            return;
        }

        // カメラから現在の顔画像をキャプチャし特徴量を抽出
        const video = document.getElementById("videoFeed");
        const captureCanvas = document.createElement("canvas");
        captureCanvas.width = 160;
        captureCanvas.height = 160;
        const ctx = captureCanvas.getContext("2d");
        ctx.drawImage(video, 0, 0, 160, 160);

        // 簡易的な顔の輝度分布グラディエント特徴ベクトル生成
        const imgData = ctx.getImageData(0, 0, 160, 160).data;
        const currentFeatures = extractFaceFeatures(imgData);

        if (currentCameraMode === "register") {
            // 顔登録処理
            saveRegisteredFaceData(scannedCardId, currentFeatures);
            stopCamera();
            document.getElementById("successDetail").textContent = `カード (${scannedCardId}) と顔データの特徴登録が正常に完了しました。`;
            showScreen("screenSuccess");
        } else {
            // 顔認証処理
            stopCamera();
            notify("顔認証を実行中...");

            const isMatch = verifyFaceFeatures(currentFeatures, registeredFaceFeatures);

            if (isMatch) {
                notify("認証成功！");
                document.getElementById("successDetail").textContent = `金額 ¥${Number(currentInputPrice).toLocaleString()} の顔認証決済が完了しました。`;
                showScreen("screenSuccess");

                // P2P相手にも完了を通知
                sendP2PData({
                    type: "PAYMENT_COMPLETE",
                    amount: currentInputPrice
                });
            } else {
                notify("顔認証に失敗しました。登録された顔と一致しません。");
                setTimeout(() => {
                    resetToHome();
                }, 2000);
            }
        }
    }

    // 画像ピクセルデータからの特徴ベクトル算出
    function extractFaceFeatures(pixelData) {
        let blockAverages = [];
        const blockSize = 16; // 10x10ブロックに分割
        for (let i = 0; i < pixelData.length; i += 4 * blockSize * blockSize) {
            let sum = 0;
            for (let j = 0; j < 4 * blockSize && (i + j) < pixelData.length; j += 4) {
                sum += pixelData[i + j]; // R値を利用
            }
            blockAverages.push(Math.round(sum / blockSize));
        }
        return blockAverages;
    }

    // 顔特徴量のコサイン類似度照合
    function verifyFaceFeatures(featA, featB) {
        if (!featB || featA.length !== featB.length) {
            // 登録データがない場合は初回デモとして承認
            console.warn("登録顔データが存在しないため直接認証を通過します");
            return true;
        }

        let dotProduct = 0;
        let normA = 0;
        let normB = 0;
        for (let i = 0; i < featA.length; i++) {
            dotProduct += featA[i] * featB[i];
            normA += featA[i] * featA[i];
            normB += featB[i] * featB[i];
        }
        const similarity = dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
        console.log("Face Feature Similarity:", similarity);

        return similarity > 0.85; // 類似度閾値
    }

    function saveRegisteredFaceData(cardId, features) {
        registeredFaceFeatures = features;
        localStorage.setItem("tong_registered_card", cardId);
        localStorage.setItem("tong_face_features", JSON.stringify(features));
        notify("顔特徴データをローカルに保存しました");
    }

    function loadRegisteredFaceData() {
        const saved = localStorage.getItem("tong_face_features");
        if (saved) {
            registeredFaceFeatures = JSON.parse(saved);
        }
    }

    // --- 4. ユーザー操作フロー制御 ---

    function resetToHome() {
        stopCamera();
        cancelNfcScan();
        showScreen("screenHome");
        currentInputPrice = "0";
        document.getElementById("priceDisplay").textContent = "¥0";
    }

    function startPaymentFlow() {
        showScreen("screenPairing");
    }

    function appendKey(val) {
        if (currentInputPrice === "0") {
            currentInputPrice = val === "00" ? "0" : val;
        } else {
            if (currentInputPrice.length < 7) {
                currentInputPrice += val;
            }
        }
        document.getElementById("priceDisplay").textContent = "¥" + Number(currentInputPrice).toLocaleString();
    }

    function clearKey() {
        currentInputPrice = "0";
        document.getElementById("priceDisplay").textContent = "¥0";
    }

    function submitPrice() {
        if (currentInputPrice === "0") {
            notify("金額を入力してください");
            return;
        }

        // P2P端末へ金額を送信
        sendP2PData({
            type: "PAYMENT_REQUEST",
            amount: currentInputPrice
        });

        startNfcScanForPayment();
    }

    function startNfcScanForPayment() {
        showScreen("screenNfcTouch");
        startNfcScan((cardId) => {
            scannedCardId = cardId;
            notify("カード読み取り完了。顔認証へ進みます");
            startCameraAndFaceDetection("auth");
        });
    }

    function startFaceRegisterFlow() {
        showScreen("screenNfcTouch");
        startNfcScan((cardId) => {
            scannedCardId = cardId;
            notify("登録カード認識成功。顔登録カメラを起動します");
            startCameraAndFaceDetection("register");
        });
    }
</script>
