<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超音波サインイン認証</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: #f3f4f6;
      letter-spacing: 0.05em;
    }

    p {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 2rem;
    }

    /* アニメーション用チェックマーク */
    .success-mark {
      display: none;
      width: 100px;
      height: 100px;
      margin: 1rem auto 2rem;
    }

    .checkmark-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 3;
      stroke-miterlimit: 10;
      stroke: #10b981;
      fill: none;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .checkmark-check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      stroke-width: 4;
      stroke: #10b981;
      fill: none;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
    }

    @keyframes stroke {
      100% { stroke-dashoffset: 0; }
    }

    /* パルス波形演出 */
    .pulse-box {
      width: 100px;
      height: 100px;
      margin: 1rem auto 2rem;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #3b82f6;
      animation: pulse 2s infinite ease-out;
      opacity: 0;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .status-text {
      font-size: 0.95rem;
      font-weight: bold;
      color: #3b82f6;
      min-height: 1.5em;
    }

    /* ボタンデザイン */
    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.75rem;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }
    .btn-primary:active { transform: scale(0.98); background: #2563eb; }

    .btn-secondary {
      background: #1f2937;
      color: #d1d5db;
      border: 1px solid #374151;
    }
    .btn-secondary:active { transform: scale(0.98); background: #374151; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔊 近接サウンド認証</h1>
    <p>端末を近づけて音波で認証します</p>

    <!-- 待機中の波形アニメーション -->
    <div class="pulse-box" id="pulseBox">
      <div class="pulse-ring"></div>
      <span style="font-size: 2.5rem;">🎙️</span>
    </div>

    <!-- 成功時のチェックマークSVG -->
    <svg class="success-mark" id="successMark" viewBox="0 0 52 52">
      <circle class="checkmark-circle" cx="26" cy="26" r="23"/>
      <path class="checkmark-check" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
    </svg>

    <div class="status-text" id="status">待機中</div>

    <button class="btn btn-primary" onclick="startListening()">受信側（マイクで聴く）</button>
    <button class="btn btn-secondary" onclick="emitSound()">送信側（音波を出す）</button>
  </div>

  <script>
    const FREQUENCY = 18500; // 超音波領域に近い18.5kHz
    let audioCtx = null;

    // --- 送信側：音波（高周波）を出力 ---
    function emitSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(FREQUENCY, audioCtx.currentTime); // 18.5kHz
      
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.1);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8); // 0.8秒間鳴らす

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);

      document.getElementById('status').innerText = "🔊 音波送信中...";
      document.getElementById('status').style.color = "#3b82f6";
    }

    // --- 受信側：マイクで指定周波数を検知 ---
    async function startListening() {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "🎧 信号を検出中...";
      statusEl.style.color = "#eab308";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // 特定の周波数（18.5kHz）のインデックスを計算
        const nyquist = audioCtx.sampleRate / 2;
        const targetIndex = Math.round((FREQUENCY / nyquist) * bufferLength);

        function checkAudio() {
          analyser.getByteFrequencyData(dataArray);
          const targetVolume = dataArray[targetIndex];

          // しきい値（音量）を超えたら認証成功
          if (targetVolume > 100) { 
            showSuccess();
            stream.getTracks().forEach(track => track.stop()); // マイク停止
            return;
          }
          requestAnimationFrame(checkAudio);
        }

        checkAudio();

      } catch (err) {
        statusEl.innerText = "マイクの使用許可が必要です";
        statusEl.style.color = "#ef4444";
      }
    }

    // 認証成功時の演出
    function showSuccess() {
      document.getElementById('pulseBox').style.display = 'none';
      const mark = document.getElementById('successMark');
      mark.style.display = 'block';

      const statusEl = document.getElementById('status');
      statusEl.innerText = "認証成功！サインイン完了";
      statusEl.style.color = "#10b981";
    }
  </script>
</body>
</html>
